# Local development: Postgres only.
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   python scripts/seed.py
#   uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       bbi_dev
      POSTGRES_USER:     bbi_dev
      POSTGRES_PASSWORD: bbi_dev_local
    ports:
      - "5433:5432"      # 5433 on host to avoid conflicts with system Postgres
    volumes:
      - bbi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bbi_pg_data:
